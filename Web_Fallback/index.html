<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IT Game Jam 2026 - Web Game Prototype</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d0f18;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #gameContainer {
      position: relative;
      border: 3px solid #4a5568;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      overflow: hidden;
    }
    canvas {
      display: block;
      background: #111422;
    }
    #uiOverlay {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      font-size: 20px;
      font-weight: bold;
      pointer-events: none;
      text-shadow: 2px 2px 0 #000;
    }
    #gameOverScreen {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    #gameOverScreen h1 { font-size: 48px; color: #ff3366; margin-bottom: 10px; }
    #gameOverScreen p { font-size: 20px; color: #ccc; margin-bottom: 20px; }
    .btn {
      padding: 10px 24px;
      font-size: 18px;
      background: #38bdf8;
      color: #000;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn:hover { background: #7dd3fc; }
  </style>
</head>
<body>

  <div id="gameContainer">
    <canvas id="gameCanvas" width="960" height="540"></canvas>
    
    <div id="uiOverlay">
      <div id="scoreDisplay">SCORE: 0</div>
      <div id="hpDisplay">HP: 3 / 3</div>
    </div>

    <div id="gameOverScreen">
      <h1>GAME OVER</h1>
      <p id="finalScoreDisplay">Final Score: 0</p>
      <p style="color: #38bdf8; font-size: 16px;">Press [R] or click below to Restart</p>
      <button class="btn" onclick="restartGame()">RESTART</button>
    </div>
  </div>

  <p style="margin-top: 12px; color: #64748b; font-size: 14px;">Controls: WASD to Move | Mouse to Aim & Shoot | SPACE to Dash | R to Restart</p>

  <script>
    // Audio Synth (Zero external files needed)
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioContext();

    function playTone(freq, type, duration) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let keys = {};
    let mouse = { x: canvas.width / 2, y: canvas.height / 2, down: false };
    let score = 0;
    let gameOver = false;

    // Player
    const player = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      radius: 16,
      speed: 4,
      hp: 3,
      maxHp: 3,
      color: "#38bdf8"
    };

    let bullets = [];
    let enemies = [];
    let particles = [];
    let lastShoot = 0;

    window.addEventListener("keydown", e => {
      keys[e.key.toLowerCase()] = true;
      if (e.key.toLowerCase() === 'r' && gameOver) restartGame();
    });
    window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

    canvas.addEventListener("mousemove", e => {
      const rect = canvas.getBoundingClientRect();
      mouse.x = e.clientX - rect.left;
      mouse.y = e.clientY - rect.top;
    });
    canvas.addEventListener("mousedown", () => mouse.down = true);
    canvas.addEventListener("mouseup", () => mouse.down = false);

    function spawnEnemy() {
      if (gameOver) return;
      const angle = Math.random() * Math.PI * 2;
      const dist = Math.max(canvas.width, canvas.height);
      enemies.push({
        x: player.x + Math.cos(angle) * dist,
        y: player.y + Math.sin(angle) * dist,
        radius: 14,
        speed: 1.5 + Math.random() * 1.5,
        hp: 1,
        color: "#ff3366"
      });
    }
    setInterval(spawnEnemy, 1200);

    function createExplosion(x, y, color) {
      for (let i = 0; i < 12; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4 + 1;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1,
          color
        });
      }
    }

    function restartGame() {
      player.x = canvas.width / 2;
      player.y = canvas.height / 2;
      player.hp = player.maxHp;
      score = 0;
      bullets = [];
      enemies = [];
      particles = [];
      gameOver = false;
      document.getElementById("gameOverScreen").style.display = "none";
      updateUI();
    }

    function updateUI() {
      document.getElementById("scoreDisplay").innerText = `SCORE: ${score}`;
      document.getElementById("hpDisplay").innerText = `HP: ${player.hp} / ${player.maxHp}`;
    }

    function loop(now) {
      requestAnimationFrame(loop);
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (!gameOver) {
        // Player Movement
        let dx = 0, dy = 0;
        if (keys['w'] || keys['arrowup']) dy -= 1;
        if (keys['s'] || keys['arrowdown']) dy += 1;
        if (keys['a'] || keys['arrowleft']) dx -= 1;
        if (keys['d'] || keys['arrowright']) dx += 1;
        if (dx !== 0 && dy !== 0) { dx *= 0.7071; dy *= 0.7071; }

        player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x + dx * player.speed));
        player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y + dy * player.speed));

        // Shooting
        if (mouse.down && now - lastShoot > 200) {
          const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
          bullets.push({
            x: player.x,
            y: player.y,
            vx: Math.cos(angle) * 9,
            vy: Math.sin(angle) * 9,
            radius: 4
          });
          playTone(600, 'square', 0.08);
          lastShoot = now;
        }

        // Bullets Update
        for (let i = bullets.length - 1; i >= 0; i--) {
          const b = bullets[i];
          b.x += b.vx;
          b.y += b.vy;
          if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
            bullets.splice(i, 1);
          }
        }

        // Enemies Update
        for (let i = enemies.length - 1; i >= 0; i--) {
          const e = enemies[i];
          const angle = Math.atan2(player.y - e.y, player.x - e.x);
          e.x += Math.cos(angle) * e.speed;
          e.y += Math.sin(angle) * e.speed;

          // Bullet vs Enemy
          for (let j = bullets.length - 1; j >= 0; j--) {
            const b = bullets[j];
            const dist = Math.hypot(e.x - b.x, e.y - b.y);
            if (dist < e.radius + b.radius) {
              e.hp--;
              bullets.splice(j, 1);
              createExplosion(e.x, e.y, e.color);
              playTone(150, 'sawtooth', 0.12);
              if (e.hp <= 0) {
                enemies.splice(i, 1);
                score += 10;
                updateUI();
              }
              break;
            }
          }

          // Enemy vs Player
          if (Math.hypot(e.x - player.x, e.y - player.y) < e.radius + player.radius) {
            player.hp--;
            createExplosion(player.x, player.y, "#fff");
            playTone(80, 'sawtooth', 0.25);
            enemies.splice(i, 1);
            updateUI();
            if (player.hp <= 0) {
              gameOver = true;
              document.getElementById("finalScoreDisplay").innerText = `Final Score: ${score}`;
              document.getElementById("gameOverScreen").style.display = "flex";
            }
          }
        }
      }

      // Render Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.03;
        if (p.life <= 0) particles.splice(i, 1);
        else {
          ctx.fillStyle = p.color;
          ctx.globalAlpha = p.life;
          ctx.beginPath();
          ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.globalAlpha = 1;

      // Render Bullets
      ctx.fillStyle = "#facc15";
      bullets.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fill();
      });

      // Render Enemies
      enemies.forEach(e => {
        ctx.fillStyle = e.color;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
        ctx.fill();
      });

      // Render Player
      if (!gameOver) {
        ctx.fillStyle = player.color;
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
        ctx.fill();

        // Gun barrel
        const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(player.x, player.y);
        ctx.lineTo(player.x + Math.cos(angle) * 24, player.y + Math.sin(angle) * 24);
        ctx.stroke();
      }
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
